# .github/workflows/ci.yml
# HustleHub+ Backend CI Workflow
# Runs on push to main and pull requests

name: HustleHub+ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ============================================
  # Backend Checks (API)
  # ============================================
  backend-checks:
    name: Backend (Node.js)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # Test across multiple Node.js versions

    defaults:
      run:
        working-directory: ./api

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Run ESLint (if configured)
      - name: Run ESLint
        run: npm run lint || echo "No lint script found"

      # 5. Run unit tests (if configured)
      - name: Run unit tests
        run: npm test || echo "No test script found"

      # 6. Verify server starts (quick check)
      - name: Verify server starts
        run: |
          timeout 5s node server.js || code=$?; if [ $code -ne 0 ] && [ $code -ne 124 ]; then exit $code; fi
        continue-on-error: true

  # ============================================
  # Security & Quality Checks
  # ============================================
  security-checks:
    name: Security & Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      # 1. Install dependencies
      - name: Install dependencies
        run: npm ci
